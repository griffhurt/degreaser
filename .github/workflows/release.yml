name: Release

# Pushing a tag vX.Y.Z (matching degreaser.__version__ and a CHANGELOG.md section) builds the
# macOS DMG, Windows installer and Linux AppImage, signs the update feeds and creates a DRAFT
# GitHub release. Review it, then publish it: only published releases reach the update feeds.
# Running the workflow by hand builds everything as a test, without creating a release.
#
# Secrets (docs/releasing.md): MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, NOTARY_KEY,
# NOTARY_KEY_ID, NOTARY_ISSUER, SPARKLE_ED_PRIVATE_KEY.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  LINUX_QT_DEPS: >-
    libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
    libglib2.0-0 libxcb-cursor0 libpulse0
  # Third-party release tools, pinned with the SHA-256 GitHub publishes for each asset.
  SPARKLE_URL: https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
  WINSPARKLE_URL: https://github.com/vslavik/winsparkle/releases/download/v0.9.4/WinSparkle-0.9.4.zip
  WINSPARKLE_SHA256: 6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  INNOSETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
  INNOSETUP_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      IS_RELEASE: ${{ github.event_name == 'push' }}
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARY_KEY != '' }}
      HAS_UPDATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -nE 's/^__version__ = "(.*)"/\1/p' src/degreaser/__init__.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"
          if [[ "$IS_RELEASE" == "true" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match degreaser.__version__ ($version)"; exit 1
          fi
          grep -Eq "^## \[?$version\]?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no $version section"; exit 1; }
          if [[ -z "$(tr -d '[:space:]' < src/degreaser/updates/public_key.txt)" ]]; then
            msg="src/degreaser/updates/public_key.txt is empty (run packaging/generate_update_key.py)"
            if [[ "$IS_RELEASE" == "true" ]]; then echo "::error::$msg"; exit 1; else echo "::warning::$msg"; fi
          fi
          if [[ "$IS_RELEASE" == "true" && ( "$HAS_SIGNING" != "true" || "$HAS_UPDATE_KEY" != "true" ) ]]; then
            echo "::error::A release needs the signing, notarisation and update-key secrets (docs/releasing.md)"; exit 1
          fi

  macos:
    needs: check
    runs-on: macos-15
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --group build
      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in the certificate"; exit 1; }
          echo "DEGREASER_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Write the notarisation key
        if: env.NOTARY_KEY != ''
        run: |
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Download Sparkle
        run: |
          curl -fsSLo sparkle.tar.xz "$SPARKLE_URL"
          echo "$SPARKLE_SHA256  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf sparkle.tar.xz -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_DIR=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"
      - run: uv run pyinstaller packaging/degreaser.spec --noconfirm
      - run: packaging/macos/release.sh
      - name: Smoke test the signed app
        run: |
          dist/Degreaser.app/Contents/MacOS/Degreaser --smoke-test --report-file smoke.json
          python3 -c "import json,sys; r=json.load(open('smoke.json')); print(r); sys.exit(0 if r['updater']=='sparkle' and not r['errors'] else 1)"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Degreaser-*-macOS.dmg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked --group build
      - run: uv run pyinstaller packaging/degreaser.spec --noconfirm
      - name: Add WinSparkle
        run: |
          Invoke-WebRequest $env:WINSPARKLE_URL -OutFile winsparkle.zip
          if ((Get-FileHash winsparkle.zip -Algorithm SHA256).Hash -ne $env:WINSPARKLE_SHA256) { throw "WinSparkle checksum mismatch" }
          Expand-Archive winsparkle.zip -DestinationPath $env:RUNNER_TEMP\winsparkle
          $ws = Get-ChildItem $env:RUNNER_TEMP\winsparkle -Directory | Where-Object Name -like 'WinSparkle-*' | Select-Object -First 1
          Copy-Item "$($ws.FullName)\x64\Release\WinSparkle.dll" dist\Degreaser\
          Copy-Item "$($ws.FullName)\COPYING" dist\Degreaser\WinSparkle-LICENSE.txt
      - name: Smoke test the packaged app
        run: |
          $p = Start-Process -FilePath dist\Degreaser\Degreaser.exe -ArgumentList '--smoke-test','--report-file','smoke.json' -Wait -PassThru
          $r = Get-Content smoke.json | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5
          if ($p.ExitCode -ne 0 -or $r.updater -ne 'winsparkle' -or $r.errors.Count -gt 0) { exit 1 }
      - name: Build the installer
        run: |
          Invoke-WebRequest $env:INNOSETUP_URL -OutFile innosetup.exe
          if ((Get-FileHash innosetup.exe -Algorithm SHA256).Hash -ne $env:INNOSETUP_SHA256) { throw "Inno Setup checksum mismatch" }
          Start-Process innosetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$env:RUNNER_TEMP\inno" -Wait
          & "$env:RUNNER_TEMP\inno\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\degreaser.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Degreaser-*-Windows-Setup.exe
          if-no-files-found: error

  linux:
    needs: check
    # The oldest supported runner: bundled system libraries set the minimum glibc.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_QT_DEPS libasound2
      - run: uv sync --locked --group build
      - run: uv run pyinstaller packaging/degreaser.spec --noconfirm
      - name: Download appimagetool
        run: |
          curl -fsSLo "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - run: packaging/linux/build_appimage.sh
      - name: Smoke test the AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Degreaser-*-x86_64.AppImage --smoke-test --report-file smoke.json
          python3 -c "import json,sys; r=json.load(open('smoke.json')); print(r); sys.exit(0 if r['updater']=='feed' and not r['errors'] else 1)"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/Degreaser-*-x86_64.AppImage
            dist/Degreaser-*-x86_64.AppImage.zsync
          if-no-files-found: error

  publish:
    needs: [check, macos, windows, linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Sign the update feeds
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          uv run --no-dev python packaging/appcast.py "$VERSION" assets \
            --macos "assets/Degreaser-$VERSION-macOS.dmg" \
            --windows "assets/Degreaser-$VERSION-Windows-Setup.exe" \
            --linux "assets/Degreaser-$VERSION-x86_64.AppImage" \
            --notes-out notes.md
      - name: Create the draft release
        run: |
          gh release create "v$VERSION" --draft --verify-tag --title "Degreaser $VERSION" \
            --notes-file notes.md assets/*
