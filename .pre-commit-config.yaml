# Uses the project's locked tool versions via uv, so hooks match CI exactly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Bundled third-party assets (fonts, icons, licence texts) must stay byte-for-byte.
      - id: trailing-whitespace
        exclude: ^src/degreaser/ui/assets/
      - id: end-of-file-fixer
        exclude: ^src/degreaser/ui/assets/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
