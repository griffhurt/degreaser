[global]
    server role = standalone server
    workgroup = WORKGROUP
    map to guest = never
    server min protocol = SMB2_10
    log level = 1
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    # Mimic a typical NAS that also serves Macs.
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    ea support = yes

# General-purpose share; each test works in its own subfolder.
[data]
    path = /srv/data
    read only = no
    valid users = degreaser

# Large generated tree for listing/throughput benchmarks.
[bench]
    path = /srv/bench
    read only = no
    valid users = degreaser
